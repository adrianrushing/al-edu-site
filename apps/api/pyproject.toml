[project]
name = "eflt-api"
version = "0.1.0"
description = "FastAPI service for querying EFLT Postgres datasets"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.122.0",
    "pydantic-settings>=2.11.0",
    "psycopg[binary]>=3.2.1",
    "psycopg-pool>=3.2.6",
    "uvicorn>=0.38.0",
    "scikit-learn>=1.8.0",
    "pandas>=3.0.2",
    "scipy>=1.17.1",
    "joblib>=1.5.3",
    "sqlalchemy>=2.0.49",
    "psycopg2-binary>=2.9.11",
    "numpy>=2.4.4",
    "statsmodels>=0.14.6",
    "torch>=2.11.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.ruff]
extend = "../../pyproject.toml"
